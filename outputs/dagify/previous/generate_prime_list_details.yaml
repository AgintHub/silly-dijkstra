dag_type: plain_text
description: A workflow to generate a list of the i'th prime number for i from 2 to
  10
name: generate_prime_list
nodes:
  compile_prime_list:
    agent: false
    description: Compile the list of i'th prime numbers for i from 2 to 10
    name: compile_prime_list
    nodes_depended_on:
    - get_2nd_prime
    - get_3rd_prime
    - get_4th_prime
    - get_5th_prime
    - get_6th_prime
    - get_7th_prime
    - get_8th_prime
    - get_9th_prime
    - get_10th_prime
    nodes_dependent_on: []
    prompt: Create a list containing the i'th prime number for i from 2 to 10 using
      the results from the get_i'th_prime steps.
  get_10th_prime:
    agent: false
    description: Get the 10th prime number
    name: get_10th_prime
    nodes_depended_on:
    - get_nth_prime
    nodes_dependent_on:
    - compile_prime_list
    prompt: Use the get_nth_prime step to find the 10th prime number.
