dag_type: plain_text
description: A workflow to create a list of prime numbers starting from the first
  prime number
name: generate_prime_list
nodes:
  append_prime_to_list:
    agent: false
    description: Append a prime number to the list of primes
    name: append_prime_to_list
    nodes_depended_on:
    - generate_nth_prime
    nodes_dependent_on:
    - check_if_list_has_desired_length
    prompt: Append the input prime number to the list of primes. Return the updated
      list.
  check_if_list_has_desired_length:
    agent: false
    description: Check if the list of primes has reached the desired length
    name: check_if_list_has_desired_length
    nodes_depended_on:
    - append_prime_to_list
    nodes_dependent_on:
    - return_final_list
    prompt: Check if the length of the input list is equal to the desired length.
      If yes, return 'true', otherwise return 'false'.
  check_if_number_is_prime:
    agent: false
    description: Check if a given number is prime
    name: check_if_number_is_prime
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Determine if the input number is prime. Return 'true' if prime, 'false'
      otherwise.
  generate_next_prime:
    agent: false
    description: Generate the next prime number after a given number
    name: generate_next_prime
    nodes_depended_on:
    - check_if_number_is_prime
    nodes_dependent_on: []
    prompt: Starting from the input number, incrementally check subsequent numbers
      until a prime number is found. Return the prime number.
  generate_nth_prime:
    agent: false
    description: Generate the nth prime number
    name: generate_nth_prime
    nodes_depended_on:
    - generate_next_prime
    nodes_dependent_on:
    - append_prime_to_list
    prompt: Starting from the first prime, iteratively generate the next prime until
      the nth prime is reached. Return the nth prime number.
  initialize_first_prime:
    agent: false
    description: Initialize the first prime number
    name: initialize_first_prime
    nodes_depended_on: []
    nodes_dependent_on:
    - generate_next_prime
    prompt: Return the first prime number, which is 2.
  initialize_prime_list:
    agent: false
    description: Initialize an empty list to store prime numbers
    name: initialize_prime_list
    nodes_depended_on: []
    nodes_dependent_on:
    - append_prime_to_list
    prompt: Create an empty list to store prime numbers.
  return_final_list:
    agent: false
    description: Return the final list of primes
    name: return_final_list
    nodes_depended_on:
    - check_if_list_has_desired_length
    nodes_dependent_on: []
    prompt: Return the input list as the final list of primes.
  set_desired_list_length:
    agent: false
    description: Set the desired length of the prime number list
    name: set_desired_list_length
    nodes_depended_on: []
    nodes_dependent_on:
    - check_if_list_has_desired_length
    prompt: Return the desired length of the prime number list.
