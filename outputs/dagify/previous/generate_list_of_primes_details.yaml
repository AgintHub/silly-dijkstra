dag_type: plain_text
description: A workflow to create a list where each successive node i is the i'th
  prime number.
name: generate_list_of_primes
nodes:
  append_prime_to_list:
    agent: false
    description: Append the newly found prime to the list of primes.
    name: append_prime_to_list
    nodes_depended_on:
    - generate_next_prime
    - initialize_prime_list
    nodes_dependent_on: []
    prompt: Append the new prime number to the existing list of primes.
  check_if_prime:
    agent: false
    description: Check if a given number is prime.
    name: check_if_prime
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Determine if the input number is prime. Return true if prime, false otherwise.
  generate_next_prime:
    agent: false
    description: Generate the next prime number after the last known prime.
    name: generate_next_prime
    nodes_depended_on:
    - check_if_prime
    nodes_dependent_on: []
    prompt: Starting from the last known prime + 1, check each number to see if it's
      prime using the 'check_if_prime' step. Return the first prime found.
  initialize_prime_list:
    agent: false
    description: Start with the first prime number, 2.
    name: initialize_prime_list
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Initialize a list with the first prime number, 2.
  repeat_prime_generation:
    agent: false
    description: Repeat the process of generating and appending primes until the desired
      list length is achieved.
    name: repeat_prime_generation
    nodes_depended_on:
    - append_prime_to_list
    nodes_dependent_on: []
    prompt: Continue generating and appending prime numbers to the list until it contains
      the desired number of primes.
