dag_type: plain_text
description: A workflow to identify and list the first 5 prime numbers
name: list_first_5_primes
nodes:
  check_if_number_is_prime:
    agent: false
    description: Check if a given number is prime
    name: check_if_number_is_prime
    nodes_depended_on:
    - define_prime_number
    - initialize_number_list
    nodes_dependent_on: []
    prompt: Check if the current number is prime by verifying it has no divisors other
      than 1 and itself.
  collect_prime_numbers:
    agent: false
    description: Collect the first 5 prime numbers found
    name: collect_prime_numbers
    nodes_depended_on:
    - check_if_number_is_prime
    nodes_dependent_on: []
    prompt: Keep track of prime numbers found and stop once 5 primes are identified.
  define_prime_number:
    agent: false
    description: Define what a prime number is
    name: define_prime_number
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Define a prime number. A prime number is a natural number greater than
      1 that has no positive divisors other than 1 and itself.
  initialize_number_list:
    agent: false
    description: Start checking numbers from 2 onwards
    name: initialize_number_list
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Start checking numbers from 2 onwards to find prime numbers.
  list_first_5_primes:
    agent: false
    description: List the first 5 prime numbers
    name: list_first_5_primes
    nodes_depended_on:
    - collect_prime_numbers
    nodes_dependent_on: []
    prompt: List the first 5 prime numbers that were found.
