dag_type: plain_text
description: A workflow to solve a quadratic equation of the form ax^2 + bx + c =
  0
name: solve_quadratic_equation
nodes:
  calculate_complex_roots:
    agent: false
    description: Calculate the complex roots using the quadratic formula when the
      discriminant is negative
    name: calculate_complex_roots
    nodes_depended_on:
    - get_coefficients
    - calculate_discriminant
    - determine_root_type
    nodes_dependent_on: []
    prompt: Using the quadratic formula (-b ± i*sqrt(-discriminant)) / (2a), calculate
      the complex roots if the discriminant is negative
  calculate_discriminant:
    agent: false
    description: Calculate the discriminant (b^2 - 4ac) of the quadratic equation
    name: calculate_discriminant
    nodes_depended_on:
    - get_coefficients
    nodes_dependent_on: []
    prompt: Using the values of a, b, and c, calculate the discriminant as b^2 - 4ac
  calculate_real_roots:
    agent: false
    description: Calculate the roots using the quadratic formula when the discriminant
      is non-negative
    name: calculate_real_roots
    nodes_depended_on:
    - get_coefficients
    - calculate_discriminant
    - determine_root_type
    nodes_dependent_on: []
    prompt: Using the quadratic formula (-b ± sqrt(discriminant)) / (2a), calculate
      the roots if the discriminant is non-negative
  determine_root_type:
    agent: false
    description: Determine if the roots are real or complex based on the discriminant
    name: determine_root_type
    nodes_depended_on:
    - calculate_discriminant
    nodes_dependent_on: []
    prompt: If the discriminant is positive, the roots are real and distinct. If it's
      zero, the roots are real and equal. If it's negative, the roots are complex.
      Determine the type based on the discriminant value
  format_roots:
    agent: false
    description: Format the calculated roots for presentation
    name: format_roots
    nodes_depended_on:
    - calculate_real_roots
    - calculate_complex_roots
    nodes_dependent_on: []
    prompt: Format the roots (real or complex) in a clear and understandable manner
  get_coefficients:
    agent: false
    description: Obtain the coefficients a, b, and c of the quadratic equation
    name: get_coefficients
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Provide the values of a, b, and c in the quadratic equation ax^2 + bx
      + c = 0
  present_solution:
    agent: false
    description: Present the final solution, including the type of roots and their
      values
    name: present_solution
    nodes_depended_on:
    - determine_root_type
    - format_roots
    nodes_dependent_on: []
    prompt: Clearly present the type of roots (real or complex) and their formatted
      values as the solution to the quadratic equation
